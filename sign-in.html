<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Layout</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Header -->
  <header class="bg-primary text-white p-3">
    <div class="container d-flex flex-row justify-content-center align-items-center" style="gap: 300px;">
      <h2 class="mb-0">Temply</h2>
      <nav class="mt-2">
        <a href="index.html" class="btn btn-primary me-2">Home</a>
        <a href="about.html" class="btn btn-primary me-2 fw-bolder">About</a>
        <a href="contact.html" class="btn btn-primary me-2">Contact</a>
      </nav>
      <nav class="mt-2">
        <a href="sign-up.html" class="bg-light btn btn-outline-primary me-2">Sign Up</a>
        <a href="sign-in.html" class="bg-light btn btn-outline-primary me-2">Sign In</a>
      </nav>
    </div>
  </header>

  <form id="sign-in" class="container d-flex flex-column justify-content-center align-items-center" style="margin-top: 100px; gap: 20px;" onsubmit="return validateForm()">
    <h2 class="mb-0">Welcome Back!</h2>
    <div class="input-group" style="width: 35%;">
      <input type="email" class="form-control" id="email" placeholder="Email Address">
    </div>
    <div style="width: 35%;">
      <input type="password" class="form-control" id="password" placeholder="Password">
    </div>
    <div style="width: 35%;">
      <input type="checkbox" id="agree" name="agree" class="me-2">
      <label for="agree">I agree to the above information</label>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 35%;">SIGN IN</button>
  </form>
  <div id="hasil" class="container mt-4 d-flex justify-content-center" style="display: none;"></div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-3 mt-auto">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-1">Temply</h5>
        <small>© 2024 Temply. All rights reserved.</small>
      </div>
      <div>
        <a href="#" class="text-decoration-none text-white  me-3 ">Privacy</a>
        <a href="#" class="text-decoration-none text-white me-3">Terms</a>
        <a href="#" class="text-decoration-none text-white">Support</a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function validateForm() {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const agree = document.getElementById("agree").checked;
      const divHasil = document.getElementById('hasil');

      let isValid = true;

      if (email === "" || !email.includes("@") || !email.includes(".")) {
          isValid = false;
      }

      if (pass === "" || pass.length < 6) {
          isValid = false;
      }

      if (!agree) {
          isValid = false;
      }

      divHasil.style.display = "flex";

      if (isValid) {
          divHasil.innerHTML = `
              <div class="alert alert-success w-100" style="max-width: 35%;" role="alert">
                  <h4 class="alert-heading mb-2">✅ Success</h4>
                  <p class="mb-0">You've successfully signed in.</p>
              </div>
          `;
          
          document.getElementById("sign-in").reset();
          return true;
      } else {
          divHasil.innerHTML = `
              <div class="alert alert-danger w-100" style="max-width: 35%;" role="alert">
                  <h4 class="alert-heading mb-2">❌ Failed</h4>
                  <p class="mb-0">You've failed to sign in. Please check your credentials and try again.</p>
              </div>
          `;
          return false;
      }
    }
  </script>
</body>
</html>
