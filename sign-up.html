<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Layout</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Header -->
  <header class="bg-primary text-white p-3">
    <div class="container d-flex flex-row justify-content-center align-items-center" style="gap: 300px;">
      <h2 class="mb-0">Temply</h2>
      <nav class="mt-2">
        <a href="index.html" class="btn btn-primary me-2">Home</a>
        <a href="about.html" class="btn btn-primary me-2 fw-bolder">About</a>
        <a href="contact.html" class="btn btn-primary me-2">Contact</a>
      </nav>
      <nav class="mt-2">
        <a href="sign-up.html" class="bg-light btn btn-outline-primary me-2">Sign Up</a>
        <a href="sign-in.html" class="bg-light btn btn-outline-primary me-2">Sign In</a>
      </nav>
    </div>
  </header>

  <form id="sign-up" class="container d-flex flex-column justify-content-center align-items-center" style="margin-top: 100px; gap: 20px;" onsubmit="return validateForm()">
    <h2 class="mb-0">Please Sign Up</h2>
    <div class="d-flex align-items-center gap-2" style="width: 35%;">
      <input type="text" id="fname" class="form-control" placeholder="First Name">
      <input type="text" id="lname" class="form-control" placeholder="Last Name">
    </div>
    <div style="width: 35%;">
      <input type="text" id="dname" class="form-control" placeholder="Display Name">
    </div>
    <div style="width: 35%;">
      <input type="email" id="email" class="form-control" placeholder="Email Address">
    </div>
    <div class="d-flex align-items-center gap-2" style="width: 35%;">
      <input type="password" id="password" class="form-control" placeholder="Password">
      <input type="password" id="cpassword" class="form-control" placeholder="Confirm Password">
    </div>
    <button type="submit" class="btn btn-primary" style="width: 35%;">SIGN UP</button>
  </form>
  <div id="hasil" class="container mt-4 d-flex justify-content-center" style="display: none;"></div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-3 mt-auto">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-1">Temply</h5>
        <small>© 2024 Temply. All rights reserved.</small>
      </div>
      <div>
        <a href="#" class="text-decoration-none text-white  me-3 ">Privacy</a>
        <a href="#" class="text-decoration-none text-white me-3">Terms</a>
        <a href="#" class="text-decoration-none text-white">Support</a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function validateForm() {
      event.preventDefault();
      const first_name = document.getElementById("fname").value;
      const last_name = document.getElementById("lname").value;
      const display_name = document.getElementById("dname").value;
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const cpass = document.getElementById("cpassword").value;
      const divHasil = document.getElementById("hasil");

      let isValid = true;

      if (first_name === "") {
          isValid = false;
      }

      if (last_name === "") {
          isValid = false;
      }

      if (display_name === "") {
          isValid = false;
      }

      if (email === "" || !email.includes("@") || !email.includes(".")) {
          isValid = false;
      }

      if (pass === "" || pass.length < 6) {
          isValid = false;
      }

      if (cpass === "" || cpass !== pass) {
          isValid = false;
      }

      divHasil.style.display = "flex";

      if (isValid) {
          divHasil.innerHTML = `
              <div class="alert alert-success w-100" style="max-width: 35%;" role="alert">
                  <h4 class="alert-heading mb-2">✅ Success</h4>
                  <p class="mb-0">You've successfully signed up.</p>
              </div>
          `;
          
          document.getElementById("sign-up").reset();
          return true;
      } else {
          divHasil.innerHTML = `
              <div class="alert alert-danger w-100" style="max-width: 35%;" role="alert">
                  <h4 class="alert-heading mb-2">❌ Failed</h4>
                  <p class="mb-0">You've failed to sign up. Please check your credentials and try again.</p>
              </div>
          `;
          return false;
      }
    }
  </script>
</body>
</html>
